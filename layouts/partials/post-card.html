<li class="post-card">
  <a class="post-card-title" href="{{ .RelPermalink }}">{{ .Title }}</a>
  <div class="post-card-meta">
    {{ with .Params.tags }}
      <span class="tags">{{ range . }}<span class="tag">{{ . }}</span>{{ end }}</span>
    {{ end }}
    <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2 Jan 2006" }}</time>
  </div>
</li>
