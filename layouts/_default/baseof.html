<!DOCTYPE html>
<html lang="{{ site.Language.Lang }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {{ partial "head-seo.html" . }}
  {{ partial "lang-detect.html" . }}
  <link rel="stylesheet" href="{{ "css/style.css" | absURL }}">
  <link rel="icon" href="{{ "img/favicon.svg" | absURL }}" type="image/svg+xml">
  {{ with .OutputFormats.Get "rss" }}<link rel="alternate" type="application/rss+xml" href="{{ .Permalink }}" title="{{ site.Title }}">{{ end }}
</head>
<body>
  <a class="skip-link" href="#content">{{ if eq site.Language.Lang "es" }}Saltar al contenido{{ else }}Skip to content{{ end }}</a>
  {{ partial "header.html" . }}
  <main id="content" class="wrap{{ if .Params.wide }} wrap-wide{{ end }}">
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
</body>
</html>
